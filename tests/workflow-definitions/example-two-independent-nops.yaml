kind: DataManagerWorkflow
kind-version: "2025.2"
name: two-independent-nops
description: >-
  A workflow with two steps that do not depend on each other.
  Neither step has any "plumbing" so both are READY as soon as the workflow
  starts, and the engine is expected to launch both of them from the
  single START message.

steps:

- name: step-1
  specification:
    collection: workflow-engine-unit-test-jobs
    job: nop
    version: "1.0.0"

- name: step-2
  specification:
    collection: workflow-engine-unit-test-jobs
    job: nop
    version: "1.0.0"
