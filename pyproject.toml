[project]
name = "im-data-manager-workflow-engine"
# The version is not maintained by hand. The publish workflow sets it from the
# git tag being released ('uv version <tag>') before building the wheel.
version = "1.0.0"
description = "The Data Manager workflow engine, schema and decoder."
authors = [
    { name = "Alan Christie", email = "achristie@informaticsmatters.com" },
    { name = "Kalev Takkis", email = "ktakkis@informaticsmatters.com" },
]
readme = "README.rst"
license-files = ["LICENSE"]
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "im-protobuf >= 8.2.0, < 9.0.0",
    "im-data-manager-job-decoder >= 2.5.0, < 3.0.0",
    "jsonschema >= 4.21.1, < 5.0.0",
    "pyyaml >= 5.3.1, < 7.0",
]

[dependency-groups]
dev = [
    "coverage >= 7.6.2, < 8.0.0",
    "pre-commit >= 3.7.0, < 4.0.0",
    "pytest",
]

[build-system]
requires = ["uv_build >= 0.9.0, < 0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The package sits at the repository root ('workflow/') rather than under
# 'src/', which is what the backend assumes by default.
module-name = "workflow"
module-root = ""

[tool.coverage.run]
omit = [
    "tests/*",
]

[tool.mypy]
strict = true
disallow_untyped_decorators = false
disallow_subclassing_any = false
implicit_reexport = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true

[tool.pylint]
disable = [
    "fixme",
    "R",
    "too-few-public-methods",
    "too-many-arguments",
]
# 'workflow_engine.py' is deliberately one large module - see the "Module
# philosophy" note in its docstring, which is explicit that it should not be
# split up merely to reduce its size.
max-module-lines = 1200
ignored-classes = [
    "PodMessage",
]
ignored-modules = [
    "informaticsmatters.protobuf",
]
