---
name: build

# -----------------
# Control variables (GitHub Secrets)
# -----------------
#
# At the GitHub 'organisation' or 'project' level you must have the following
# GitHub 'Repository Secrets' defined (i.e. via 'Settings -> Secrets'): -
#
# (none)
#
# -----------
# Environment (GitHub Environments)
# -----------
#
# Environment         (none)

on:
  push:
    branches:
    - '**'
    tags-ignore:
    - '**'
  schedule:
  # Build daily at 6:04am...
  - cron: '4 6 * * *'

env:
  UV_VERSION: '0.11.21'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
        - '3.13'
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
    - name: Install requirements
      # '--locked' fails the build if uv.lock is out of date. The project itself
      # is installed (editable), so 'workflow' still imports from the working
      # tree, and the packaging configuration gets exercised on every build.
      run: |
        uv sync --locked
    - name: Test
      run: |
        uv run pre-commit run --all-files
        uv run coverage run --module pytest -Werror
        uv run coverage report
    - name: Build
      run: |
        uv build --wheel
